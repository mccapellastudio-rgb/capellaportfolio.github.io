<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capella Portfolio</title>
<style>
:root{
  --bg:#0c0d12;
  --glass:rgba(18,19,27,.62);
  --line:rgba(255,255,255,.09);
  --text:#eceef5;
  --muted:#9ba0b4;
  --accent:#8ef6ff;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Aptos,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* blurred background image */
body::before{
  content:"";position:fixed;inset:-40px;z-index:-2;
  background:url("img/bg.png") center/cover no-repeat;
  filter:blur(28px);transform:scale(1.05);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(12,13,18,.72),rgba(12,13,18,.9));
}

/* nav */
header{
  position:sticky;top:0;z-index:5;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:600;font-size:17px}
.hero-logo{display:block;height:148px;width:auto;max-width:100%;margin:0 auto 28px;border-radius:32px;image-rendering:pixelated;box-shadow:0 20px 60px rgba(0,0,0,.5)}
nav ul{display:flex;gap:28px;list-style:none}
nav a{color:var(--muted);text-decoration:none;font-size:15px;transition:color .2s}
nav a:hover,nav a:focus-visible{color:var(--text);outline:none}

main{max-width:1080px;margin:0 auto;padding:0 24px}

/* hero */
.hero{text-align:center;padding:128px 0 112px}
h1{font-size:clamp(48px,8vw,84px);line-height:1.05;font-weight:650;letter-spacing:-.03em;margin-bottom:20px}
.hero p{color:var(--muted);font-size:19px;max-width:36ch;margin:0 auto 34px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:11px 24px;border-radius:999px;font:inherit;font-size:15px;font-weight:550;text-decoration:none;cursor:pointer;
  border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.05);transition:border-color .2s,background .2s}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:#08090d}
.btn.main:hover,.btn.main:focus-visible{background:#b4faff}


/* gallery */
section.gallery{padding-bottom:96px}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h2{font-size:28px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.tabs button{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 18px;cursor:pointer;transition:.2s}
.tabs button:hover,.tabs button:focus-visible{color:var(--text);outline:none}
.tabs button.on{background:rgba(255,255,255,.1);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}

/* scroll slide-in: odd rows enter from the right, even rows from the left */
.card.slide{
  opacity:0;
  transition:transform .8s cubic-bezier(.22,.8,.3,1),opacity .8s ease,border-color .2s;
  transition-delay:calc(var(--col,0) * 110ms),calc(var(--col,0) * 110ms),0s;
  will-change:transform,opacity;
}
.card.slide.from-right{transform:translateX(120px)}
.card.slide.from-left{transform:translateX(-120px)}
.card.slide.in{opacity:1;transform:none}
.card img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}

/* contact + footer */
footer{border-top:1px solid var(--line);max-width:1080px;margin:0 auto;padding:28px 24px 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer nav{display:flex;gap:22px}
footer a{color:var(--muted);text-decoration:none;transition:color .2s}
footer a:hover,footer a:focus-visible{color:var(--accent);outline:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,7,10,.9);backdrop-filter:blur(8px)}
.lb.open{display:flex}
.lb-box{position:relative;width:min(960px,100%)}
.lb-box img{display:block;width:100%;max-height:78vh;object-fit:contain;image-rendering:pixelated;border-radius:var(--radius)}
.lb-meta{display:flex;justify-content:space-between;padding-top:12px;font-size:14px;color:var(--muted)}
.lb-meta b{color:var(--text);font-weight:600}
.lb button{position:absolute;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#16171f;color:var(--text);font:inherit;font-size:18px;cursor:pointer;transition:.2s}
.lb button:hover,.lb button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.x{top:-16px;right:-16px}.prev{left:-16px;top:45%}.next{right:-16px;top:45%}

@media (max-width:860px){
  .hero{padding:88px 0 72px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  nav ul{gap:18px}
  .grid{grid-template-columns:1fr}
  .x{top:8px;right:8px}.prev{left:8px}.next{right:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}.card.slide{transition:transform .8s cubic-bezier(.22,.8,.3,1),opacity .8s ease!important}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="#top">
      Capella
    </a>
    <nav aria-label="Main">
      <ul>
        <li><a href="#work">Work</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero">
    <img class="hero-logo" src="img/capella.png" alt="Capella logo">
    <h1>Capella</h1>
    <p>Smithing weapons and items for your games!</p>
    <div class="actions">
      <a class="btn main" href="#work">View work</a>
    </div>
  </section>

  <section class="gallery" id="work">
    <div class="head">
      <h2>Work</h2>
      <div class="tabs" id="tabs">
        <button class="on" data-f="all">All</button>
        <button data-f="anim">Animated</button>
        <button data-f="static">Static</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

</main>

<footer>
  <span>© Capella</span>
  <nav aria-label="Social links"><a href="#">YouTube</a><a href="#">X</a><a href="#">Discord</a></nav>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-box">
    <button class="x" id="lbX" aria-label="Close">✕</button>
    <button class="prev" id="lbP" aria-label="Previous">‹</button>
    <button class="next" id="lbN" aria-label="Next">›</button>
    <img id="lbImg" alt="">
    <div class="lb-meta"><b id="lbT"></b><span id="lbC"></span></div>
  </div>
</div>

<script>
// type: "anim" (GIF) or "static" (PNG)
const items = [
  { src:"img/anim-1.gif", title:"Animated 1", type:"anim" },
  { src:"img/anim-2.gif", title:"Animated 2", type:"anim" },
  ...Array.from({length:12}, (_, i) => ({ src:`img/${i+1}.png`, title:`Weapon ${i+1}`, type:"static" }))
];

const grid = document.getElementById("grid");
const lb = document.getElementById("lb");
let filter = "all", view = [], idx = 0;

function setFilter(f){
  filter = f;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  render();
}

const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    // slide in when scrolling down into view, reset when it leaves below so it replays
    if (en.isIntersecting) en.target.classList.add("in");
    else if (en.boundingClientRect.top > 0) en.target.classList.remove("in");
  });
}, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });

function render(){
  view = items.filter(i => filter === "all" || i.type === filter);
  io.disconnect();
  grid.innerHTML = "";
  const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length || 1;
  view.forEach((it, n) => {
    const c = document.createElement("div");
    const row = Math.floor(n / cols);
    c.className = "card slide " + (row % 2 === 0 ? "from-right" : "from-left");
    c.style.setProperty("--col", n % cols);
    c.tabIndex = 0;
    c.innerHTML = `<img src="${it.src}" alt="${it.title}" loading="lazy">`;
    c.onclick = () => openLb(n);
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(n); } };
    grid.appendChild(c);
    io.observe(c);
  });
}

document.getElementById("tabs").onclick = e => {
  const b = e.target.closest("button");
  if (b) setFilter(b.dataset.f);
};

function show(){
  const it = view[idx];
  const img = document.getElementById("lbImg");
  img.src = it.src;
  img.alt = it.title;
  document.getElementById("lbT").textContent = it.title;
  document.getElementById("lbC").textContent = `${idx + 1} / ${view.length}`;
}
function openLb(n){ idx = n; show(); lb.classList.add("open"); }
function closeLb(){ lb.classList.remove("open"); }
function step(d){ idx = (idx + d + view.length) % view.length; show(); }

document.getElementById("lbX").onclick = closeLb;
document.getElementById("lbP").onclick = () => step(-1);
document.getElementById("lbN").onclick = () => step(1);
lb.onclick = e => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

render();
</script>
</body>
</html>
